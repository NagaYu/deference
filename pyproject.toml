[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deference"
version = "0.1.0"
description = "日本語敬語の誤り検出・修正 — 敬意の向きを、規範の根拠つきで"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["japanese", "keigo", "honorifics", "grammatical-error-detection", "nlp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Natural Language :: Japanese",
  "Topic :: Text Processing :: Linguistic",
]
# 中核は標準ライブラリのみで動く。CPU 即応の前提を保つため、
# 重い依存は optional-dependencies に分ける。
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.1", "transformers>=4.40", "datasets>=2.18", "accelerate>=0.27", "scikit-learn>=1.3", "sentencepiece>=0.2"]
export = ["onnx>=1.15", "onnxruntime>=1.17", "optimum>=1.17", "huggingface_hub>=0.22"]
app = ["gradio>=4.0"]
bench = ["matplotlib>=3.7", "numpy>=1.24", "pandas>=2.0"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
all = ["deference[train,export,app,bench,llm,dev]"]

[project.scripts]
deference = "deference.cli:main"

[tool.setuptools.packages.find]
include = ["deference*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::UserWarning",
  "ignore::DeprecationWarning",
]
