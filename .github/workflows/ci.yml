name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: install textlint baseline
        run: |
          cd .baseline_textlint && npm install --no-audit --no-fund
      - name: pytest
        env:
          DEFERENCE_DEBUG: "1"
        run: python -m pytest tests/ -q
